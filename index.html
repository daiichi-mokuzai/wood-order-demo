<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>木材Web受注 デモ</title><style>body{font-family:system-ui,sans-serif;background:#f4f6f3;color:#203329;margin:0}header{background:#24513c;color:white;padding:18px}main{max-width:850px;margin:auto;padding:18px}.card{background:white;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0001}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.photo{height:110px;background:linear-gradient(120deg,#b68c5b,#e2c69a,#a97945);border-radius:8px;display:grid;place-items:center;color:#442b12;font-weight:bold}button{background:#24513c;color:white;border:0;border-radius:8px;padding:12px;cursor:pointer}input{padding:10px;border:1px solid #bbb;border-radius:6px;max-width:95%}label{display:block;margin:12px 0}.muted{color:#647168;font-size:13px}.hidden{display:none}nav{display:flex;gap:8px;margin:12px 0}nav span{padding:8px;background:#dce5dc;border-radius:8px}li{margin:8px 0}</style></head><body><header><strong>木材Web受注システム｜提案用デモ</strong><div style="font-size:12px">※実際の注文・送信は行われません</div></header><main><nav><span>①商品選択</span><span>②注文確認</span><span>③受付完了</span></nav><section id="shop"><h2>商品を選ぶ</h2><p class="muted">商品・寸法はすべて仮のサンプルです。写真欄は仮画像です。</p><div class="products" id="products"></div><div class="card"><h3>買い物カゴ <span id="count">0</span>点</h3><ul id="cart"></ul><button onclick="next()">配送希望日の入力へ</button></div></section><section id="checkout" class="hidden"><h2>注文内容と配送希望日</h2><div class="card"><div id="summary"></div><label>取引先名（必須）<input id="company" placeholder="例：〇〇工務店"></label><label>ご担当者名（必須）<input id="person" placeholder="例：山田"></label><label>電話番号（必須）<input id="phone" type="tel" placeholder="例：090-0000-0000"></label><label>配送希望日（必須）<input id="date" type="date"></label><label>納品先・備考<textarea id="notes" style="width:95%;height:70px" placeholder="現場名・納品先住所など"></textarea></label><p class="muted">在庫と配送可否は未確定です。弊社で確認後、担当者よりご連絡します。</p><button onclick="finish()">デモ注文を確定する</button> <button onclick="back()" style="background:#777">戻る</button></div></section><section id="done" class="hidden"><div class="card"><h2>✓ 注文を受け付けました（デモ）</h2><p>ご注文ありがとうございます。在庫状況およびご希望日の配送可否を確認のうえ、ご連絡します。</p><p class="muted">これはデモ画面です。実際の注文受付やLINE通知は行われていません。</p><h3>社内LINE通知イメージ</h3><pre id="message" style="white-space:pre-wrap;background:#e7f3e8;padding:14px;border-radius:8px"></pre><button onclick="location.reload()">最初から試す</button></div></section></main><script>const items=[{name:'杉 KD間柱',spec:'30×105×3000mm',detail:'乾燥材・下地用途'},{name:'ホワイトウッド SPF',spec:'2×4×6F',detail:'一般建築・下地材'},{name:'構造用合板',spec:'12×910×1820mm',detail:'床・壁の下地用途'},{name:'針葉樹合板',spec:'9×910×1820mm',detail:'下地・養生用途'},{name:'杉 貫板',spec:'15×90×4000mm',detail:'仮設・下地用途'},{name:'赤松 垂木',spec:'45×45×4000mm',detail:'屋根・下地用途'}];let cart={};document.getElementById('date').min=new Date(Date.now()+86400000).toLocaleDateString('en-CA');document.getElementById('products').innerHTML=items.map((p,i)=>`<div class="card"><div class="photo">商品写真（準備中）</div><h3>${p.name}</h3><div>${p.spec}</div><p class="muted">${p.detail}</p><label>数量 <input id="q${i}" type="number" min="1" value="1" style="width:70px"></label><button onclick="add(${i})">カゴに入れる</button></div>`).join('');function add(i){let n=Number(document.getElementById('q'+i).value);if(!Number.isInteger(n)||n<1)return alert('数量を確認してください');cart[i]=(cart[i]||0)+n;render()}function render(){document.getElementById('count').textContent=Object.values(cart).reduce((a,b)=>a+b,0);document.getElementById('cart').innerHTML=Object.entries(cart).map(([i,n])=>`<li>${items[i].name}（${items[i].spec}） × ${n} <button onclick="removeItem(${i})" style="padding:4px 8px;background:#777">削除</button></li>`).join('')||'<li>商品はまだありません</li>'}function removeItem(i){delete cart[i];render()}function next(){if(!Object.keys(cart).length)return alert('商品を選択してください');document.getElementById('summary').innerHTML='<h3>ご注文商品</h3>'+Object.entries(cart).map(([i,n])=>`<p>${items[i].name} ${items[i].spec} × ${n}</p>`).join('');document.getElementById('shop').classList.add('hidden');document.getElementById('checkout').classList.remove('hidden');scrollTo(0,0)}function back(){document.getElementById('checkout').classList.add('hidden');document.getElementById('shop').classList.remove('hidden')}function finish(){let ids=['company','person','phone','date'];if(ids.some(id=>!document.getElementById(id).value.trim()))return alert('必須項目を入力してください');let v=id=>document.getElementById(id).value;document.getElementById('message').textContent='【Web注文受付・デモ】\n取引先：'+v('company')+'\n担当者：'+v('person')+'\n電話：'+v('phone')+'\n配送希望日：'+v('date')+'\n商品：\n'+Object.entries(cart).map(([i,n])=>'・'+items[i].name+' '+items[i].spec+' × '+n).join('\n')+'\n納品先・備考：'+v('notes')+'\n※在庫・配送可否は要確認';document.getElementById('checkout').classList.add('hidden');document.getElementById('done').classList.remove('hidden');scrollTo(0,0)}render();</script></body></html>
