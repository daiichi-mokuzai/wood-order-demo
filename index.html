function checkout(){if(!cart.length)return;view='checkout';render()}
function finish(){let f=$('orderform');if(!f.reportValidity())return;let data=new FormData(f), lines=cart.map(x=>{let p=products.find(z=>z.id===x.id);return `商品ID: ${p.id}\n${p.category} / ${p.sub} / ${p.name}\n寸法: ${dims(p)}\n数量: ${qtyLabel(p,x.q)}`});let msg=`【Web受注デモ・注文内容】\n取引先名: ${data.get('company')}\n現場名: ${data.get('site')}\n担当者: ${data.get('contact')}\n電話番号: ${data.get('phone')}\n配送希望日: ${data.get('date')}\n備考: ${data.get('notes')||'なし'}\n\n${lines.join('\n\n')}\n\n※デモ：LINE送信・注文登録はされていません。`;view='done';$('main').innerHTML=`<section class="panel"><h2>入力内容の確認が完了しました（デモ）</h2><div class="notice">実際の注文は送信されていません。在庫・配送希望日は担当者確認後に連絡する運用を想定しています。</div><h3>社内LINE通知文面の見本</h3><pre>${esc(msg)}</pre><button class="primary" onclick="navigator.clipboard?.writeText(window.lastMessage)">文面をコピー</button> <button onclick="showCatalog()">商品一覧へ戻る</button></section>`;window.lastMessage=msg;renderCart()}
function render(){let out='';if(view==='catalog'){out=`<section class="panel"><h2>商品を選ぶ</h2><div class="crumb"><button onclick="category=null;subcategory=null;showCatalog()">カテゴリー</button>${category?`<button onclick="subcategory=null;showCatalog()">${esc(category)}</button>`:''}${subcategory?`<span class="tag">${esc(subcategory)}</span>`:''}</div>`;if(!category){let cats=[...new Set(products.map(p=>p.category))];out+=`<p class="muted">カテゴリーを選択してください</p><div class="items">${cats.map(c=>`<button class="item" onclick="chooseCat(${JSON.stringify(c)})"><h3>${esc(c)}</h3><div class="muted">${products.filter(p=>p.category===c).length}商品 ›</div></button>`).join('')}</div>`}else if(!subcategory){let subs=[...new Set(products.filter(p=>p.category===category).map(p=>p.sub))];out+=`<p class="muted">サブカテゴリーを選択してください</p><div class="items">${subs.map(s=>`<button class="item" onclick="chooseSub(${JSON.stringify(s)})"><h3>${esc(s)}</h3><div class="muted">${products.filter(p=>p.category===category&&p.sub===s).length}商品 ›</div></button>`).join('')}</div>`}else{let filtered=products.filter(p=>p.category===category&&p.sub===subcategory);out+=`<p class="muted">${filtered.length}商品</p><div class="items">${filtered.map(p=>`<button class="item" onclick="showProduct(${p.id})"><h3>${esc(p.name)}</h3><div>${esc(dims(p))}</div><p class="tag">${label(p)}</p><div class="muted">詳細を見る ›</div></button>`).join('')}</div>`}out+='</section>'}else if(view==='detail'){let p=selected;out=`<section class="panel"><button onclick="showCatalog()">← 商品一覧に戻る</button><h2>${esc(p.name)}</h2><div class="detail">${photo}<div><p class="tag">${esc(p.category)} / ${esc(p.sub)}</p><h3>商品情報</h3><p>寸法：${esc(dims(p))}</p><p>出荷単位：${label(p)}</p><p class="muted">${esc(p.category)}の取扱商品です。詳細な商品説明・実物写真は準備中です。</p>${p.unit==='要確認'?'<div class="notice">販売単位の確認が必要です。</div>':`<h3>注文数量</h3><div class="qty"><button onclick="setQty(quantity-1)">−</button><strong>${quantity}${p.unit}</strong><button onclick="setQty(quantity+1)">＋</button></div><p><strong>${qtyLabel(p,quantity)}</strong></p><button class="primary" onclick="addCart()">カゴに入れる</button>`}</div></div></section>`}else if(view==='checkout'){out=`<section class="panel"><button onclick="showCatalog()">← 商品選択に戻る</button><h2>お客様情報・配送希望日</h2><div class="notice">在庫の有無、配送希望日への対応可否は、担当者が確認してご連絡します。</div><form id="orderform" onsubmit="event.preventDefault();finish()"><label class="field">取引先名（必須）<input name="company" required maxlength="100"></label><label class="field">現場名（必須）<input name="site" required maxlength="100"></label><label class="field">担当者名（必須）<input name="contact" required maxlength="100"></label><label class="field">電話番号（必須）<input name="phone" type="tel" required maxlength="30"></label><label class="field">配送希望日（必須）<input name="date" type="date" required min="${new Date().toLocaleDateString('sv-SE')}"></label><label class="field">備考<textarea name="notes" rows="3"></textarea></label><button class="primary" type="submit">注文内容を確認（デモ）</button></form></section>`} $('main').innerHTML=out;renderCart()}
function renderCart(){let total=cart.reduce((a,x)=>a+x.q,0);let lines=cart.map(x=>{let p=products.find(z=>z.id===x.id);return `<div class="cartline"><strong>${esc(p.name)}</strong><div class="muted">${esc(dims(p))}</div><div><b>${qtyLabel(p,x.q)}</b></div><div class="qty"><button onclick="changeCart(${x.id},-1)">−</button><span>${x.q}${p.unit}</span><button onclick="changeCart(${x.id},1)">＋</button></div></div>`}).join('');$('cart').className='panel cart'+(!cartOpen?' collapsed':'');$('cart').innerHTML=`<button class="cartToggle" onclick="setCartOpen()">🛒 カゴ ${cart.length}商品・${total}点 ${cartOpen?'▼ 閉じる':'▲ 内容を見る'}</button><div class="cartbody"><h2>🛒 カゴの中身</h2>${cart.length?lines:'<p class="muted">まだ商品が入っていません。</p>'}${cart.length?`<p><strong>${cart.length}商品 / 注文数量 ${total}点</strong></p><button class="primary" onclick="checkout()">お客様情報・配送希望日へ進む</button>`:''}</div>`}
render();
</script></body></html>
