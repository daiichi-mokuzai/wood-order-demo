function detail(id){selected=products.find(p=>p.id===id);quantity=1;stage='detail';const p=selected;$('app').innerHTML=`<button class="secondary" onclick="browse()">← 商品一覧</button><div class="card"><div class="photo" style="height:230px"></div><h2>${esc(p.name)}</h2><p>${esc(p.category)} ／ ${esc(p.dimension)}</p><p class="muted">${esc(p.name)}の商品です。詳しい特徴・用途は確認後に掲載します。</p><p><b>出荷単位：</b>${p.unit==='束'?'10本／束（束単位のみ）':p.unit==='枚'?'1枚単位':'販売単位を確認中'}</p>${p.unit==='要確認'?'<p class="error">販売単位未確認のため、この商品は現在注文できません。</p>':`<div class="line"><b>注文数量</b><div class="qty"><button onclick="changeQty(-1)">−</button><strong id="q">1 ${p.unit}</strong><button onclick="changeQty(1)">＋</button></div></div><p id="total">${p.unit==='束'?'1束（10本）':'1枚'}</p><button class="wide" onclick="addCart()">カゴに入れる</button>`}</div>`;count()}
function changeQty(n){quantity=Math.max(1,quantity+n);$('q').textContent=quantity+' '+selected.unit;$('total').textContent=selected.unit==='束'?`${quantity}束（${quantity*10}本）`:`${quantity}枚`}
function addCart(){let item=cart.find(x=>x.id===selected.id);if(item)item.qty+=quantity;else cart.push({...selected,qty:quantity});showCart()}
function showCart(){stage='cart';$('app').innerHTML=`<button class="secondary" onclick="browse()">← 商品を追加</button><h2>買い物カゴ</h2><div class="card">${cart.length?cart.map((p,i)=>`<div class="cartrow"><b>${esc(p.name)}</b><p class="muted">${esc(p.dimension)}</p><div class="line"><span>${p.qty}${p.unit}${p.unit==='束'?`（${p.qty*10}本）`:''}</span><button class="secondary" onclick="removeItem(${i})">削除</button></div></div>`).join(''):'カゴは空です。'}</div>${cart.length?'<button class="wide" onclick="customer()">お客様情報・配送希望日へ →</button>':''}`;count()}
function removeItem(i){cart.splice(i,1);showCart()}
function customer(){stage='customer';$('app').innerHTML=`<button class="secondary" onclick="showCart()">← カゴに戻る</button><h2>お客様情報・配送希望日</h2><div class="card"><form id="order" onsubmit="complete(event)"><label>会社名（必須）<input name="company" required maxlength="100"></label><label>ご担当者名（必須）<input name="contact" required maxlength="100"></label><label>電話番号（必須）<input name="phone" type="tel" required maxlength="30"></label><label>現場名（必須）<input name="site" required maxlength="150"></label><label>納品先住所（必須）<input name="address" required maxlength="250"></label><label>配送希望日（必須）<input id="date" name="date" type="date" required></label><label>備考<textarea name="note" rows="3"></textarea></label><div class="notice">在庫の有無およびご希望日に配送できるかは、担当者が確認してご連絡します。これはデモのため注文は送信されません。</div><p><button class="wide" type="submit">デモ注文内容を確認</button></p></form></div>`;const today=new Date();today.setHours(12,0,0,0);$('date').min=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;count()}
function complete(e){e.preventDefault();let f=new FormData(e.target);let fields=Object.fromEntries(f.entries());let lines=['【Web受注デモ／実際の注文ではありません】',`会社名：${fields.company}`,`担当者：${fields.contact}`,`電話：${fields.phone}`,`現場名：${fields.site}`,`納品先：${fields.address}`,`配送希望日：${fields.date}`,'【商品明細】',...cart.map(p=>`商品ID：${p.id} ／ ${p.category} ${p.name} ／ ${p.dimension} ／ ${p.qty}${p.unit}${p.unit==='束'?`（${p.qty*10}本）`:''}`),`備考：${fields.note||'なし'}`];let msg=lines.join('\n');stage='done';$('app').innerHTML=`<h2>注文内容の確認（デモ）</h2><div class="card"><div class="notice"><b>デモ完了</b><p>実際の注文受付・LINE送信・データ保存は行っていません。</p><p>在庫と配送希望日の可否は、正式運用時には確認後に担当者からご連絡します。</p></div><h3>社内LINE通知文面（見本）</h3><textarea id="message" rows="16" readonly></textarea><button onclick="copyMessage()">文面をコピー</button></div><button class="secondary" onclick="cart=[];cat=null;browse()">最初に戻る</button>`;$('message').value=msg;count()}
function copyMessage(){navigator.clipboard?.writeText($('message').value).then(()=>alert('コピーしました')).catch(()=>{$('message').select();alert('文面を選択しました。コピーしてください')})}
browse();
</script></body></html>
